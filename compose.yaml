name: freelancer-lead-bot

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-freelancer_bot}
      POSTGRES_USER: ${POSTGRES_USER:-freelancer_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql

  searxng:
    image: searxng/searxng@sha256:892cf809341915a4b7710d3c9045005b4c377d51335a089b6d4da0b28750788d
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8080}:8080"
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://localhost:8080/}
      SEARXNG_BIND_ADDRESS: 0.0.0.0
      SEARXNG_PORT: 8080
      SEARXNG_LIMITER: "false"
    volumes:
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro

volumes:
  postgres-data:
